services:
  - type: web
    name: hate-terminal
    runtime: node
    nodeVersion: 20
    buildCommand: >
      npm install -g pnpm &&
      pnpm install --frozen-lockfile &&
      pnpm run typecheck:libs &&
      PORT=3000 BASE_PATH=/ pnpm --filter @workspace/greenways run build &&
      cp -r artifacts/greenways/dist/public artifacts/api-server/public &&
      pnpm --filter @workspace/api-server run build
    startCommand: node artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: MONGODB_URI
        sync: false
      - key: SITE_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
