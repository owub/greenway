services:
  - type: web
    name: greenways
    runtime: node
    nodeVersion: 20
    buildCommand: >
      npm install -g pnpm &&
      pnpm install --frozen-lockfile &&
      pnpm run typecheck:libs &&
      PORT=3000 BASE_PATH=/ pnpm --filter @workspace/greenways run build &&
      cp -r artifacts/greenways/dist/public artifacts/api-server/public &&
      pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        generateValue: false
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: SITE_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
