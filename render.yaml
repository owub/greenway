services:
  - type: web
    name: hate-terminal
    runtime: node
    nodeVersion: 20
    buildCommand: >
      npm install -g pnpm &&
      pnpm install --frozen-lockfile &&
      pnpm run typecheck &&
      PORT=3000 BASE_PATH=/ pnpm --filter @workspace/greenways run build &&
      cp -r artifacts/greenways/dist/public artifacts/api-server/public &&
      pnpm --filter @workspace/api-server run build
    startCommand: node artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: SNAPCHAT_USERNAME
        value: "ekampreet.16"
      - key: SNAPCHAT_PROFILE_ID
        sync: false
      - key: SNAPCHAT_CLIENT_ID
        sync: false
      - key: SNAPCHAT_CLIENT_SECRET
        sync: false
      - key: SNAPCHAT_REFRESH_TOKEN
        sync: false
