services:
  - type: web
    name: hate-terminal
    runtime: node
    buildCommand: >
      pnpm install --frozen-lockfile --prod=false &&
      pnpm run build:render
    startCommand: pnpm start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24.14.1"
      - key: PORT
        value: "10000"
      - key: LOG_LEVEL
        value: info
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: greenway
      - key: SNAPCHAT_USERNAME
        value: "ekampreet.16"
      - key: SNAPCHAT_DISPLAY_NAME
        sync: false
      - key: SNAPCHAT_PROFILE_ID
        sync: false
      - key: SNAPCHAT_CLIENT_ID
        sync: false
      - key: SNAPCHAT_CLIENT_SECRET
        sync: false
      - key: SNAPCHAT_REFRESH_TOKEN
        sync: false
