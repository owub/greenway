kind = "web"
previewPath = "/"
title = "HATE Terminal"
version = "1.0.0"
id = "artifacts/greenways"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20199

[services.development]
run = "pnpm --filter @workspace/greenways run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/greenways", "run", "build" ]
publicDir = "artifacts/greenways/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20199"
BASE_PATH = "/"
