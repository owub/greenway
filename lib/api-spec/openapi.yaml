openapi: 3.1.0
info:
  title: Api
  version: 2.0.0
  description: Authenticated terminal profile, video library, and shared chat API
servers:
  - url: /api
    description: Same-origin API
tags:
  - name: health
  - name: auth
  - name: videos
  - name: chat

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/verify-password:
    post:
      operationId: verifyPassword
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordInput"
      responses:
        "200":
          description: Password verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResult"

  /auth/status:
    get:
      operationId: getAuthStatus
      tags: [auth]
      responses:
        "200":
          description: Current browser session status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "200":
          description: Session cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"

  /chat/messages:
    get:
      operationId: listChatMessages
      tags: [chat]
      responses:
        "200":
          description: Latest shared chat messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
        "401":
          description: Authentication required
    post:
      operationId: sendChatMessage
      tags: [chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        "400":
          description: Invalid message
        "401":
          description: Authentication required
        "429":
          description: Rate limit reached

  /videos:
    get:
      operationId: listVideos
      tags: [videos]
      responses:
        "200":
          description: Stored videos, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Video"
        "401":
          description: Authentication required
    post:
      operationId: uploadVideo
      tags: [videos]
      parameters:
        - name: X-Video-Title
          in: header
          required: true
          schema:
            type: string
            maxLength: 120
        - name: X-Video-Description
          in: header
          required: false
          schema:
            type: string
            maxLength: 1000
        - name: X-Video-Filename
          in: header
          required: true
          schema:
            type: string
            maxLength: 255
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Video stored in MongoDB GridFS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "400":
          description: Invalid video metadata
        "401":
          description: Authentication required
        "413":
          description: Video exceeds the upload limit
        "415":
          description: Unsupported media type

  /videos/{id}:
    delete:
      operationId: deleteVideo
      tags: [videos]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Video deleted
        "401":
          description: Authentication required
        "404":
          description: Video not found

  /videos/{id}/content:
    get:
      operationId: streamVideo
      tags: [videos]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: Range
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Full video content
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "206":
          description: Partial video content
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "401":
          description: Authentication required
        "404":
          description: Video not found
        "416":
          description: Requested range is not satisfiable

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ActionResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    PasswordInput:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 256

    PasswordResult:
      type: object
      required: [valid]
      properties:
        valid:
          type: boolean

    AuthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [none, approved]

    ChatMessageInput:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500

    ChatMessage:
      type: object
      required: [id, author, text, createdAt]
      properties:
        id:
          type: string
        author:
          type: string
        text:
          type: string
        createdAt:
          type: string

    Video:
      type: object
      required: [id, title, filename, contentType, size, contentUrl, createdAt]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: ["string", "null"]
        filename:
          type: string
        contentType:
          type: string
        size:
          type: integer
          minimum: 0
        contentUrl:
          type: string
        createdAt:
          type: string
